<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Register — Furnitur</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="site-header container">
  <a href="index.html" class="logo"><img src="images/Logo.png" alt="Furnitur" onerror="this.style.display='none'"><span>FURNITUR<small>Your Future Interior</small></span></a>
  <nav class="main-nav"><a href="index.html">Home</a><a href="shop.html">Shop</a><a href="blog.html">Blog</a><a href="about.html">About Us</a></nav>
  <form class="header-search" id="headerSearchForm"><button type="submit">🔍</button><input type="text" id="headerSearchInput" placeholder="Search something"></form>
  <div class="header-actions"><a href="#love">♡ Love</a><a href="cart.html"><img class="icon-btn" src="images/cart.png" alt="" onerror="this.outerHTML='🛍'"> Cart <span class="cart-count">0</span></a></div>
  <button class="nav-toggle" aria-label="Menu"><span></span><span></span><span></span></button>
</header>

<div class="page-header"><h1>Register to Furnitur</h1><p>Get monthly voucher with just one click!</p></div>

<div class="container auth-layout">
  <div class="auth-form">
    <h1>You already have an account? <a href="login.html" class="link">Sign in here</a></h1>
    <form id="registerForm" style="margin-top:26px;">
      <div class="form-grid">
        <div class="form-field"><label>Your name</label><input type="text" id="regName" required></div>
        <div class="form-field"><label>E-mail</label><input type="email" id="regEmail" required></div>
        <div class="form-field full"><label>Phone number</label><input type="tel" required></div>
        <div class="form-field"><label>Password</label><input type="password" required></div>
        <div class="form-field"><label>Confirm Password</label><input type="password" required></div>
      </div>
      <button type="submit" class="btn">Create an account</button>
    </form>
  </div>
  <div class="auth-promo">
    <img src="images/img11.png" alt="Promo" style="max-width:70%;">
    <span class="tag">HOT</span>
    <div class="promo-text">Discount<br>25% for<br>new member</div>
  </div>
</div>

<footer><div class="container"><div class="footer-bottom" style="border:none;">
  <span>© Copyright 2020,All rights reserved</span><div class="socials"><a href="#">f</a><a href="#">t</a><a href="#">ig</a><a href="#">p</a></div></div></div></footer>

<script src="data.js"></script>
<script src="auth.js"></script>
<script src="cart.js"></script>
<script src="common.js"></script>
<script>
document.getElementById("registerForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const name = document.getElementById("regName").value;
  const email = document.getElementById("regEmail").value;
  Auth.login({ name, email });
  showToast("Account created — you're signed in!");
  const redirect = getQueryParam("redirect");
  setTimeout(() => {
    window.location.href = redirect || "index.html";
  }, 500);
});
document.getElementById("headerSearchForm").addEventListener("submit", (e) => {
  e.preventDefault();
  const q = document.getElementById("headerSearchInput").value.trim();
  window.location.href = "shop.html" + (q ? `?q=${encodeURIComponent(q)}` : "");
});
</script>
</body>
</html>
